<style>

<body>
<main>
<h1>Множення дробів та піднесення до степеня</h1>
<p class="mut">8 клас, §5. Йди по вкладках зліва направо. У кожного завдання тисни «Наступний крок» і намагайся вгадати крок, перш ніж його відкрити.</p>
<nav id="nav" aria-label="Розділи"></nav>
<div id="secs"></div>
</main>
<div id="ov"><canvas id="cv"></canvas></div>
<div id="tb" role="toolbar" aria-label="Малювання">
<button id="t-off" class="on" title="Прокручування та кнопки">✋ Звичайний</button>
<button id="t-pen" title="Олівець">✏️ Олівець</button>
<button id="t-er" title="Стирачка">🧽 Стирачка</button>
<button class="sw" data-c="#e03131" style="background:#e03131" aria-label="Червоний"></button>
<button class="sw" data-c="#1971c2" style="background:#1971c2" aria-label="Синій"></button>
<button class="sw" data-c="#2f9e44" style="background:#2f9e44" aria-label="Зелений"></button>
<button class="sw" data-c="#f08c00" style="background:#f08c00" aria-label="Помаранчевий"></button>
<input id="col" type="color" value="#e03131" aria-label="Свій колір">
<input id="sz" type="range" min="1" max="14" value="3" aria-label="Товщина">
<button id="clr" title="Стерти все на цій вкладці">🗑 Очистити</button>
</div>
<script>
const done=new Set();
const R=s=>{let p;do{p=s;s=s.replace(/\{([^{}|]*)\|([^{}]*)\}/g,'<span class="f"><span>$1</span><span>$2</span></span>')}while(p!==s);return s.replace(/\^\{?(-?\w+)\}?/g,'<sup>$1</sup>')};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

const THEORY=`
<div class="box"><h3>1. Головне правило</h3>
<p>Щоб помножити дріб на дріб: <b>зверху × зверху, знизу × знизу</b>.</p>
<div class="q">${R('{a|b}·{c|d} = {a·c|b·d}')} &nbsp; <span class="mut">(b ≠ 0, d ≠ 0)</span></div>
<p class="mut">Знаменник ніколи не дорівнює нулю — на нуль ділити не можна.</p></div>

<div class="card"><h3>Спробуй сам: калькулятор-візуалізатор</h3>
<div class="row">
<span class="f"><input id="a" type="number" value="2"><input id="b" type="number" value="3"></span>·
<span class="f"><input id="c" type="number" value="9"><input id="d" type="number" value="4"></span></div>
<div id="calc" class="q"></div>
<p class="mut">Змінюй числа й дивись: спочатку записується добуток, потім скорочення.</p></div>

<div class="box"><h3>2. Золоте правило: спочатку розклади, потім скорочуй</h3>
<ol class="al">
<li><b>Знак.</b> Скільки мінусів? Парна кількість → «+», непарна → «−».</li>
<li><b>Розклади на множники</b> усе, що можна: винеси спільний множник, застосуй формули.</li>
<li><b>Запиши одним дробом</b> (усе зверху, усе знизу), нічого поки не перемножуючи.</li>
<li><b>Викресли</b> однакові множники зверху й знизу.</li>
<li><b>Перемнож</b> те, що залишилось, і запиши відповідь.</li></ol>
<p>Цілий вираз перетворюємо на дріб зі знаменником 1: ${R('7x = {7x|1}')}.</p></div>

<div class="box"><h3>3. Формули, які потрібні для розкладання</h3>
<table>
<tr><td>${R('a^2−b^2 = (a−b)(a+b)')}</td><td>різниця квадратів</td></tr>
<tr><td>${R('a^2±2ab+b^2 = (a±b)^2')}</td><td>квадрат суми / різниці</td></tr>
<tr><td>${R('a^3+b^3 = (a+b)(a^2−ab+b^2)')}</td><td>сума кубів</td></tr>
<tr><td>${R('a^3−b^3 = (a−b)(a^2+ab+b^2)')}</td><td>різниця кубів</td></tr>
<tr><td>${R('b−a = −(a−b)')}</td><td>«перевернута» дужка: виносимо мінус</td></tr></table></div>

<div class="box"><h3>4. Піднесення дробу до степеня</h3>
<div class="q">${R('({a|b})^n = {a^n|b^n}')}</div>
<p>Степінь діє <b>на кожен множник</b> зверху й знизу. Далі:</p>
<ul><li>${R('(a^m)^n = a^{m·n}')}: степінь у степені — показники <b>множимо</b>, наприклад (m^2)^3 = m^6;</li>
<li>${R('a^m·a^n = a^{m+n}')}: однакові основи — показники <b>додаємо</b>;</li>
<li>парний степінь: (−A)^2 = A^2 (мінус зникає); непарний: (−A)^3 = −A^3 (мінус лишається).</li></ul></div>`;

const S=[
{id:'58',t:'5.8',h:'Дріб × цілий вираз',i:'Ціле перетворюємо на дріб зі знаменником 1, множимо за правилом і скорочуємо. Скорочуємо числа окремо, кожну букву окремо.',
 tasks:[
 {n:'5.8 (1)',q:'{a|16m^2}·12m',s:['Запишемо 12m дробом: 12m = {12m|1}.','Зверху × зверху, знизу × знизу: {a|16m^2}·{12m|1} = {a·12m|16m^2·1}.','Розкладаємо: 12 = 4·3, 16 = 4·4, m^2 = m·m. Викреслюємо однакове: {a·<s>4</s>·3·<s>m</s>|<s>4</s>·4·<s>m</s>·m}.','Відповідь: {3a|4m}']},
 {n:'5.8 (2)',q:'a^3·{7x^3|a^2}',s:['a^3 = {a^3|1}, тож множимо: {a^3·7x^3|1·a^2}.','Скорочуємо a^3 : a^2 = a (від показника віднімаємо показник: 3−2 = 1).','Відповідь: 7ax^3']},
{n:'5.8 (3)',q:'−{7y|4x^2}·12xy^3',s:['Мінус один, тому результат зі знаком «−». 12xy^3 = {12xy^3|1}.','−{7y·12xy^3|4x^2}. Числа: 12 : 4 = 3, тоді 7·3 = 21. Букви: y·y^3 = y^4 угорі; x : x^2 = 1/x.','Відповідь: −{21y^4|x}']},
{n:'5.8 (4)',q:'5cm^4·(−{m|15c})',s:['Один мінус → результат буде зі знаком «−». 5cm^4 = {5cm^4|1}.','Множимо: −{5cm^4·m|1·15c}. Угорі m^4·m = m^5 (показники додаємо).','Розкладаємо 15 = 5·3 і викреслюємо 5 та c: −{<s>5</s><s>c</s>·m^5|<s>5</s>·3·<s>c</s>}.','Відповідь: −{m^5|3}']},
{n:'5.8 (5)',q:'−5ab^2·(−{1|10ab})',s:['Два мінуси дають «+». 5ab^2 = {5ab^2|1}.','{5ab^2·1|1·10ab}. Скорочуємо: 5 : 10 = 1/2; a : a = 1; b^2 : b = b.','Відповідь: {b|2}']},
{n:'5.8 (6)',q:'13c^2d·{7|26c^3d^2}',s:['13c^2d = {13c^2d|1}. Множимо: {13c^2d·7|26c^3d^2}.','Числа: 26 = 13·2, тому 13 скорочується, лишається 7 угорі й 2 внизу. c^2 : c^3 = 1/c; d : d^2 = 1/d.','Відповідь: {7|2cd}']}],
 quiz:{q:'{3x|8y^2}·16y = ?',o:['{6x|y}','6xy','{3x|y}','{48xy|8y}'],c:0,w:'3x·16y = 48xy, внизу 8y^2. 48:8 = 6, y:y^2 = 1/y. Виходить 6x/y.'}},

{id:'511',t:'5.11',h:'Розкладання на множники',i:'Тут дроби «в лоб» не множимо. Спочатку розкладаємо на множники, щоб побачити однакові дужки.',
 tasks:[
 {n:'5.11 (1)',q:'{a^2+2a|5}·{a|4a+8}',s:['Розкладаємо: a^2+2a = a(a+2) (виносимо a); 4a+8 = 4(a+2) (виносимо 4).','Одним дробом: {a(a+2)·a|5·4(a+2)}.','Однакова дужка (a+2) є зверху й знизу — викреслюємо: {a<s>(a+2)</s>·a|5·4<s>(a+2)</s>}.','Відповідь: {a^2|20}']},
 {n:'5.11 (3)',q:'{2a−b|10a}·{15a^2|b−2a}',s:['Дивимось: b−2a — це «перевернута» дужка 2a−b. Виносимо мінус: b−2a = −(2a−b).','Підставляємо: {(2a−b)·15a^2|10a·(−(2a−b))}. Мінус виносимо перед дробом.','Викреслюємо (2a−b); 15 і 10 ділимо на 5; a^2 і a скорочуємо на a: −{<s>(2a−b)</s>·3·<s>5</s>a·<s>a</s>·a|2·<s>5</s>·<s>a</s>·<s>(2a−b)</s>}.','Відповідь: −{3a|2}']}],
 quiz:{q:'{b^2−b|4}·{8|b−1} = ?',o:['2b','{b|2}','2','8b'],c:0,w:'b^2−b = b(b−1). Дужка (b−1) скорочується; 8:4 = 2. Лишається 2b.'}},

{id:'513',t:'5.13',h:'Спростити й підставити',i:'Спочатку спрощуємо, і тільки потім підставляємо числа. Так рахувати набагато легше.',
 tasks:[
 {n:'5.13',q:'Спростити {5x^2+15x|y^2−2y}·{2−y|x+3} при x = 17, y = −{1|23}',s:['Розкладаємо: 5x^2+15x = 5x(x+3); y^2−2y = y(y−2); 2−y = −(y−2).','Одним дробом: {5x(x+3)·(−(y−2))|y(y−2)·(x+3)}.','Викреслюємо (x+3) і (y−2): −{5x|y}.','Підставляємо x = 17, y = −1/23: −5·17 : (−1/23). Ділити на дріб — це множити на обернений: 5·17·23.','Рахуємо: 5·17 = 85; 85·23 = 1955. Відповідь: −{5x|y}, значення 1955. Це рік, коли Катерина Ющенко створила «Адресну мову».']}],
 quiz:{q:'{x−5|7}·{7|5−x} = ?',o:['−1','1','0','x'],c:0,w:'5−x = −(x−5). Тому (x−5)/(−(x−5)) = −1.'}},

{id:'515',t:'5.15–5.16',h:'Піднесення дробу до степеня',i:'Степінь роздаємо кожному множнику: числу, кожній букві, чисельнику й знаменнику. Показник степеня в степені множимо. Дивимось на знак.',
 tasks:[
 {n:'5.15 (1)',q:'({p|4m})^3',s:['Степінь 3 діє на чисельник і на знаменник: {p^3|(4m)^3}.','(4m)^3 = 4^3·m^3 = 64m^3.','Відповідь: {p^3|64m^3}']},
 {n:'5.15 (3)',q:'(−{3m^2n|7})^2',s:['Степінь 2 парний: мінус зникає, (−A)^2 = A^2.','{3^2·(m^2)^2·n^2|7^2}. Показники множимо: (m^2)^2 = m^4.','Відповідь: {9m^4n^2|49}']},
 {n:'5.16 (1)',q:'({c|5m})^2',s:['Степінь 2 діє на чисельник і знаменник: {c^2|(5m)^2}.','(5m)^2 = 5^2·m^2 = 25m^2.','Відповідь: {c^2|25m^2}']},
{n:'5.16 (2)',q:'({y|2x^3})^4',s:['{y^4|(2x^3)^4} = {y^4|2^4·(x^3)^4}.','2^4 = 16; (x^3)^4 = x^12 (показники множимо: 3·4 = 12).','Відповідь: {y^4|16x^12}']},
{n:'5.16 (3)',q:'(−{4c^2m^3|5})^2',s:['Степінь 2 парний → мінус зникає.','{4^2·(c^2)^2·(m^3)^2|5^2}: 4^2 = 16, c^4, m^6, 5^2 = 25.','Відповідь: {16c^4m^6|25}']},
{n:'5.16 (4)',q:'(−{3c^3|m^7})^3',s:['Степінь 3 непарний: мінус залишається.','−{3^3·(c^3)^3|(m^7)^3}. Множимо показники: 3·3 = 9, 7·3 = 21.','Відповідь: −{27c^9|m^21}']},
 {n:'5.16 (5)',q:'({c^3m|2a^2})^6',s:['Степінь 6 діє на кожен множник: {(c^3)^6·m^6|2^6·(a^2)^6}.','(c^3)^6 = c^18; 2^6 = 64; (a^2)^6 = a^12.','Відповідь: {c^18m^6|64a^12}']},
{n:'5.16 (6)',q:'(−{ab^3|c^2})^8',s:['Степінь 8 парний → знак «+».','{a^8·(b^3)^8|(c^2)^8}.','Показники множимо: 3·8 = 24; 2·8 = 16.','Відповідь: {a^8b^24|c^16}']}],
 quiz:{q:'({2a|b^3})^4 = ?',o:['{16a^4|b^12}','{8a^4|b^12}','{16a^4|b^7}','{2a^4|b^12}'],c:0,w:'2^4 = 16, a^4, (b^3)^4 = b^12.'}},

{id:'517',t:'5.17',h:'Добуток трьох дробів',i:'Правило те саме: усе зверху в один чисельник, усе знизу в один знаменник. Скорочуємо числа, потім кожну букву.',
 tasks:[
 {n:'5.17 (1)',q:'{54a^2c|81b^3}·{32ab|13c^3}·{52bc^2|128a^3}',s:['Числа: зверху 54·32·52, знизу 81·13·128. Скорочуємо: 54/81 = 2/3 (ділимо на 27); 52/13 = 4; 32·4 = 128, і 128/128 = 1. Залишилось 2/3.','Буква a: зверху a^2·a = a^3, знизу a^3 → зникає.','Буква c: зверху c·c^2 = c^3, знизу c^3 → зникає. Буква b: зверху b·b = b^2, знизу b^3 → лишається b знизу.','Відповідь: {2|3b}']},
 {n:'5.17 (2)',q:'{147x^4y^2|p^3}·10xp^2·{y^3|105x^5y}',s:['10xp^2 = {10xp^2|1}. Числа: 147·10 : 105. Тут 147 = 21·7, 105 = 21·5, отже 7·10 : 5 = 14.','x: зверху x^4·x = x^5, знизу x^5 → зникає. y: зверху y^2·y^3 = y^5, знизу y → y^4 зверху.','p: зверху p^2, знизу p^3 → p знизу.','Відповідь: {14y^4|p}']}],
